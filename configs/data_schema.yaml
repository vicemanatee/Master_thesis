      string_columns: ["Run","Protein.Group","Protein.Ids","Protein.Names","Genes","First.Protein.Description","Modified.Sequence","Stripped.Sequence","Precursor.Id","File.Name","Fragment.Quant.Raw","Fragment.Quant.Corrected","Fragment.Correlations"]
